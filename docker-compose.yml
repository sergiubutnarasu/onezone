services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onezone}
      POSTGRES_USER: ${POSTGRES_USER:-onezone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onezone}
    ports:
      - "5432:5432"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onezone} -d ${POSTGRES_DB:-onezone}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "6379:6379"
    restart: unless-stopped

  garage:
    build:
      context: .
      dockerfile: docker/garage.Dockerfile
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-GKonezone}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-3a2a8c6903c5e28fe7468494c5d73d64dfd88581e166cb25cce043ff8eb11410}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET_NAME:-onezone}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
      - ./docker/garage.toml:/etc/garage.toml:ro
    restart: unless-stopped

  server-migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-onezone}:${POSTGRES_PASSWORD:-onezone}@postgres:5432/${POSTGRES_DB:-onezone}}
    depends_on:
      postgres:
        condition: service_healthy
    # One-shot init container: apply pending migrations then seed reference data.
    # `prisma db seed` reads the "prisma.seed" script from package.json.
    # Seed is idempotent (upsert with empty update), so re-runs are safe.
    command: ["sh", "-c", "node_modules/.bin/prisma migrate deploy && node_modules/.bin/prisma db seed"]
    restart: "no"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "5026:5026"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-onezone}:${POSTGRES_PASSWORD:-onezone}@postgres:5432/${POSTGRES_DB:-onezone}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:5025}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_REGION: ${S3_REGION:-garage}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-GKonezone}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-3a2a8c6903c5e28fe7468494c5d73d64dfd88581e166cb25cce043ff8eb11410}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-onezone}
    depends_on:
      server-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      garage:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5026/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5026}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "5025:5025"
    depends_on:
      - server
    restart: unless-stopped

  terminal:
    build:
      context: .
      dockerfile: apps/terminal/Dockerfile
      args: {}
    environment:
      TERMINAL_NAME: ${TERMINAL_NAME:-Onezone Docker Terminal}
      TERMINAL_SERVER_URL: ${TERMINAL_SERVER_URL:-http://server:5026}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN}
      COPILOT_PROVIDER_BASE_URL: ${COPILOT_PROVIDER_BASE_URL}
      COPILOT_PROVIDER_API_KEY: ${COPILOT_PROVIDER_API_KEY}
      COPILOT_PROVIDER_TYPE: ${COPILOT_PROVIDER_TYPE}
      OPENCODE_PROVIDER_ID: ${OPENCODE_PROVIDER_ID}
      OPENCODE_PROVIDER_BASE_URL: ${OPENCODE_PROVIDER_BASE_URL}
      OPENCODE_PROVIDER_API_KEY: ${OPENCODE_PROVIDER_API_KEY}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - terminal_ssh:/home/agent/.ssh
      - terminal_workdir:/home/agent/.onezone
      - terminal_local:/home/agent/.local
      - terminal_claude:/home/agent/.claude
      - terminal_copilot:/home/agent/.copilot
      - terminal_opencode:/home/agent/.opencode
      - terminal_acpx:/home/agent/.acpx
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  garage_meta:
  garage_data:
  terminal_ssh:
  terminal_workdir:
  terminal_local:
  terminal_claude:
  terminal_copilot:
  terminal_opencode:
  terminal_acpx:
