services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onezone}
      POSTGRES_USER: ${POSTGRES_USER:-onezone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onezone}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "5026:5026"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-onezone}:${POSTGRES_PASSWORD:-onezone}@postgres:5432/${POSTGRES_DB:-onezone}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5025}
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5026}
    ports:
      - "5025:5025"
    depends_on:
      - server

volumes:
  postgres_data:
